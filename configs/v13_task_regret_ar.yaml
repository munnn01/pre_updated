# V13: reverse CRC-V5's constrained direction.
#
# Minimize real-codec rate relative to the raw-codec anchor while a separate
# projected dual for each codec/QP cell constrains task-loss regret.  H.264 and
# H.265 are trained as separate checkpoints; codec-specific conditioning stays
# explicit in the three-dimensional FiLM input.
device: auto
out_dir: outputs/v13_task_regret
seed: 292001

task:
  name: action_recognition
  clip_size: 112
  teachers: [r3d_18, mc3_18]
  teacher_sampling: sample
  backbone: r3d_18

model:
  arch: additive_cond
  temporal_frames: 8
  strength: 1.0
  cond_dim: 3
  gate: false
  qp_ref: [20, 51]

codec:
  kind: ste
  ste_codec: h264
  ste_alternate: false
  ste_preset: medium
  qualities: [1, 2, 3, 5, 8]
  block: 8
  inter: true
  colorspace: yuv420
  chroma_step_scale: 2.0
  step_coarse: 0.25
  step_fine: 0.03
  anneal: 1.0

data:
  index: data/index/kinetics_hash_split.json
  num_frames: 16
  frame_size: 128
  temporal_stride: 2

loss:
  # Replaced dynamically by mu[codec,QP] and rate_weight when the constraint
  # is active.  Explicit zeros prevent accidental use outside that path.
  lam_task: 0.0
  beta: 0.0
  omega: 0.0
  tau: 0.0
  delta: 0.0
  gamma: 0.0
  gamma_res: 0.0
  # Preserve V12's non-dual regularizers so constrained direction is the only
  # intended treatment change.
  kappa: 10.0
  kappa_t: 0.0
  mu: 10.0
  use_task_mask: false
  rate_constraint:
    enabled: false
    target_ratio: 0.0
    dual_lr: 0.0
    lambda_init: 0.0
    lambda_max: 1.0
  task_regret_constraint:
    enabled: true
    epsilon: 0.0
    dual_lr: 0.001
    mu_init: 0.1
    mu_max: 10.0
    rate_weight: 1.0
    per_codec:
      h264:
        epsilon: 0.0
        dual_lr: 0.001
        rate_weight: 1.0
      h265:
        epsilon: 0.0
        dual_lr: 0.001
        rate_weight: 1.0

train:
  # The notebook copies the audited 500-step last checkpoint into the ordinary
  # checkpoint slot.  finetune=true loads only its model and starts a fresh
  # optimizer/dual schedule for exactly three complete epochs.
  epochs: 3
  max_steps: null
  reg_warmup_frac: 0.0
  batch_size: 2
  num_workers: 2
  lr: 1.0e-5
  clip_grad: 1.0
  qp_list: [30, 35, 40, 45, 50]
  qp_to_quality: {30: 8, 35: 5, 40: 3, 45: 2, 50: 1}
  qp_sampling_weights: null
  balanced_codec_qp: true
  cosine: false
  patience: 0
  min_delta: 1.0e-4
  val_qp_mode: all
  val_max_batches: 1
  resume: false
  finetune: true

eval:
  split: val
  include_proxy: false
  per_sequence: true
  batch_size: 2
  num_workers: 2
  held_out_backbone: r2plus1d_18
  qp_list: [30, 35, 40, 45, 50]
  preset: medium
  shard_idx: 0
  num_shards: 5
  shard_salt: v13-task-regret-screen-v1
