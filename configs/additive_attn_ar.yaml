# =============================================================================
# ATTENTIVE ADDITIVE ROUND — close the reimplementation gap to Zhao 2512.15331
#
# Diagnosis (docs + the paper's own Table 3): the repo's additive lineage
# plateaus at ~-5.9%/-3.5% (H.264/H.265), which is the level the baseline paper
# reaches with analyzer-finetune ALONE (-5.1/-5.5). The paper attributes the
# jump to -17%/-16% to the PREPROCESSOR + a codec-faithful differentiable proxy.
# This round changes exactly those two things and nothing else:
#
#   1. proxy fidelity : block MOTION COMPENSATION in the virtual codec
#                       (codec.motion) so the differentiable residual matches
#                       what x264/x265 actually transform, PLUS a trained
#                       factorized-prior rate (codec.kind: entropy) whose
#                       gradient does not die below the quantiser step.
#   2. preprocessor   : AttentiveAdditivePreprocessor — the dual-branch tree
#                       with Zhao's "conditional attention" (QP-conditioned
#                       softmax fusion) instead of the lineage's sigmoid gate.
#
# Everything else stays on the canonical harness: hash split, teacher panel,
# held-out r2plus1d_18 eval, in-grid QP protocol, identity-at-init discipline.
# =============================================================================

device: auto
out_dir: outputs/additive_attn_ar
seed: 0

task:
  name: action_recognition
  clip_size: 112
  teachers: [r3d_18, mc3_18]
  teacher_sampling: sample
  backbone: r3d_18

model:
  arch: additive_attn     # AttentiveAdditivePreprocessor (src/models/additive_attn.py)
  temporal_frames: 8
  strength: 1.0           # eval-time operating point (NOT restored from ckpt)
  cond_dim: 1             # FiLM on normalised QP
  gate: false             # ungated additive edit
  qp_ref: [20, 51]

codec:                    # differentiable TRAINING proxy (distortion + rate)
  kind: entropy           # LearnedRateCodec: trained Laplacian factorized prior
  qualities: [1, 2, 3, 5, 8]
  block: 8
  inter: true             # closed-loop P-frame prediction
  motion: true            # NEW: block motion estimation + compensation
  motion_range: 8         # integer search window (px)
  motion_block: 16        # ME block size
  colorspace: yuv420
  chroma_step_scale: 2.0
  # Steps are in [0,1] pixel units (see additive_ar.yaml D10 note); do NOT
  # coarsen to "fix" bpp.
  step_coarse: 0.25
  step_fine: 0.03
  anneal: 1.0             # A3: soft->hard quantiser anneal
  entropy_components: 3   # Laplacian mixture components per DCT position

data:
  index: data/index/kinetics_hash_split.json
  num_frames: 16
  frame_size: 128
  temporal_stride: 2

loss:                     # Zhao form + a LIGHT feature-distill (omega) re-enabled
  lam_task: 1.0
  omega: 0.1              # feature distillation, kept low; multi-teacher + held-out
                          # eval guard against the single-teacher overfit that made
                          # UP-VCM disable it. Raise only if it helps the gap.
  beta: 0.01              # rate weight on the LEARNED prior (bites more than the
                          # decorative 0.001 of the Gaussian-rate additive round)
  tau: 0.0
  delta: 0.0
  gamma: 0.0
  kappa: 0.0
  kappa_t: 0.0
  gamma_res: 0.0
  mu: 10.0                # alpha=10 MSE-to-source (Zhao distortion term)
  use_task_mask: false

train:
  epochs: 6
  max_steps: null
  reg_warmup_frac: 0.0
  batch_size: 8
  num_workers: 3
  lr: 1.0e-4
  clip_grad: 1.0
  qp_list: [30, 35, 40, 45, 50]        # randomized-QP grid (C2 in-grid protocol)
  qp_to_quality: {30: 8, 35: 5, 40: 3, 45: 2, 50: 1}
  rate_freeze_after: 2000  # Ballé phase discipline: calibrate the prior early,
                           # then freeze so beta*bpp keeps distinguishing sharp
                           # from blurred (avoids the ent50 co-adaptation collapse)
  cosine: true
  patience: 3
  min_delta: 1.0e-4
  val_qp_mode: all
  val_max_batches: 5
  resume: true
  finetune: false

eval:
  split: test
  include_proxy: false
  per_sequence: true
  batch_size: 4
  num_workers: 2
  held_out_backbone: r2plus1d_18
  qp_list: [30, 35, 40, 45, 50]
  preset: medium
